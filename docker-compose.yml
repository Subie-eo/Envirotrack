version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - LATITUDE=-1.2833
      - LONGITUDE=36.8167
      - SIMULATION_ENABLED=true
      - SIMULATION_INTERVAL=5000
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  backend_node_modules:
  frontend_node_modules:
